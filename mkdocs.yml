site_name: Wally
site_description: Lock-free, zero-allocation off-heap SPSC ring buffer for Java
repo_url: https://github.com/kaushikdey647/wally
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  version:
    provider: mike

validation:
  anchors: warn

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Implementation: implementation.md
  - Benchmarks: benchmarks.md
  - ADRs:
      - 0001 FFM over Unsafe: adr/0001-ffm-over-unsafe.md
      - 0002 Variable-length frames: adr/0002-variable-length-frames.md
      - 0003 Claim/commit and acquire/release: adr/0003-claim-commit-acquire-release.md
      - 0004 Wrap sentinel ordering: adr/0004-wrap-sentinel-ordering.md
      - 0005 False-sharing padding: adr/0005-false-sharing-padding.md
